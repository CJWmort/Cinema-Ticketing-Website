<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        h1{
            color: gold;
            font-size: 60px;
        }
        h2{
            color: whitesmoke;
            font-size: 24px;
        }
        body{
            background-color: black;
        }
        #content{
            margin: 200px;
        }
        #content a{
            text-decoration: none;
            color: whitesmoke;
            background-color: #333;
            display: block;
            font-weight: bold;
            padding: 10px 20px;
            float: left;
            border-radius: 5px;
            font-size: 20px;
        }
        #content a:hover{
            background-color: cornflowerblue;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <ul>
                <li><a class="active" href="/index.html">Home</a></li>
                <li><a href="/movie">Movies</a></li>
                <li>
                    <form id="search" action="/movie/search-movie" method="GET">
                        <label for="search"><b>Search Movie:</b></label>
                        <input type="text" name="search" placeholder="search by title">
                        <button type="submit">Search</button>
                    </form>
                </li>
            </ul>
        </div>
        <div class="nav-right">
            <ul>
                <li><a href="/account/register">Register</a></li>
            </ul>
        </div>
    </nav>
    <div id="content">
        <h1>Welcome To MyMovieList</h1>
        <h2>track, score, and review series you have watched.</h2>
        <br>
        <a href="/movie">Browse Movies</a>
    </div>
</body>
</html>
